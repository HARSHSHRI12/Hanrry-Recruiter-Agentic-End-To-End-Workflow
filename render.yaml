services:
  - type: web
    name: hanrry-ai-recruiter
    env: docker
    region: oregon
    plan: free
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/hanrry.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: BASE_URL
        # This will be automatically populated by Render, but you should set it to your actual Render URL
        generateValue: true
